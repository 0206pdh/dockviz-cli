# Weekly update PRs for Go modules and GitHub Actions versions.
# Each PR goes through ci.yml before it can be merged.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      charmbracelet:
        patterns: ["github.com/charmbracelet/*"]
      docker:
        patterns: ["github.com/docker/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
