# release.yml — test, build cross-platform binaries, and publish a release.
#
# Triggers on a pushed version tag (vMAJOR.MINOR.PATCH, optional -suffix such
# as -rc.1). Ordinary pushes to main never release; ci.yml gates those.
#
# Flow:
#   determine_version → test → build (6 targets) → package_python / package_deb
#     → release (GitHub Release + SHA256SUMS)
#     → publish_pypi     (only when vars.PYPI_PUBLISHING_ENABLED == 'true')
#     → deploy_apt_repo  (only when the APT_GPG_PRIVATE_KEY secret is set)
#
# Artifacts:
#   dockviz-{linux,darwin,windows}-{amd64,arm64}[.exe]
#   dockviz-linux-{amd64,arm64}.deb
#   dockviz-<version>-py3-none-<platform>.whl (6 platforms)
#   SHA256SUMS
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  determine_version:
    name: Determine Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate tag format
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH[-suffix]"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  test:
    name: Test Tagged Commit
    needs: determine_version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet and test
        run: |
          go vet ./...
          GOOS=windows go vet ./...
          GOOS=darwin go vet ./...
          go test -race ./...

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [determine_version, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: windows
            goarch: arm64
            ext: ".exe"
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod   # reads the 'go' directive from go.mod

      - name: Build binary
        run: |
          GOOS=${{ matrix.goos }} \
          GOARCH=${{ matrix.goarch }} \
          go build \
            -ldflags="-s -w -X main.version=${{ needs.determine_version.outputs.version }}" \
            -o dockviz-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dockviz-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dockviz-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          if-no-files-found: error

  package_python:
    name: Package Python Wheel (${{ matrix.artifact }})
    needs: [build, determine_version]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - artifact: dockviz-linux-amd64
            binary: dockviz-linux-amd64
            plat_name: manylinux_2_17_x86_64
          - artifact: dockviz-linux-arm64
            binary: dockviz-linux-arm64
            plat_name: manylinux_2_17_aarch64
          - artifact: dockviz-windows-amd64
            binary: dockviz-windows-amd64.exe
            plat_name: win_amd64
          - artifact: dockviz-windows-arm64
            binary: dockviz-windows-arm64.exe
            plat_name: win_arm64
          - artifact: dockviz-darwin-amd64
            binary: dockviz-darwin-amd64
            plat_name: macosx_10_13_x86_64
          - artifact: dockviz-darwin-arm64
            binary: dockviz-darwin-arm64
            plat_name: macosx_11_0_arm64

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download binary artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}/

      - name: Install Python build tooling
        run: python -m pip install --upgrade build setuptools wheel

      - name: Build wheel
        env:
          DOCKVIZ_BINARY: dist/${{ matrix.artifact }}/${{ matrix.binary }}
          DOCKVIZ_VERSION: ${{ needs.determine_version.outputs.version }}
          DOCKVIZ_WHEEL_PLAT_NAME: ${{ matrix.plat_name }}
        run: python -m build --wheel --outdir dist/python

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-${{ matrix.artifact }}
          path: dist/python/*.whl
          if-no-files-found: error

  package_deb:
    name: Package Debian (${{ matrix.arch }})
    needs: [build, determine_version]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - artifact: dockviz-linux-amd64
            binary: dockviz-linux-amd64
            arch: amd64
          - artifact: dockviz-linux-arm64
            binary: dockviz-linux-arm64
            arch: arm64

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Download binary artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}/

      - name: Build Debian package
        run: |
          chmod +x packaging/build-deb.sh
          packaging/build-deb.sh \
            dist/${{ matrix.artifact }}/${{ matrix.binary }} \
            ${{ needs.determine_version.outputs.version }} \
            ${{ matrix.arch }} \
            dist/deb/dockviz-linux-${{ matrix.arch }}.deb

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.arch }}
          path: dist/deb/*.deb
          if-no-files-found: error

  check_secrets:
    name: Check Optional Publish Secrets
    runs-on: ubuntu-latest
    outputs:
      apt: ${{ steps.check.outputs.apt }}
    steps:
      - name: Check which secrets are configured
        id: check
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          [ -n "$APT_GPG_PRIVATE_KEY" ] && echo "apt=true" >> "$GITHUB_OUTPUT" || echo "apt=false" >> "$GITHUB_OUTPUT"

  publish_pypi:
    name: Publish To PyPI
    if: ${{ vars.PYPI_PUBLISHING_ENABLED == 'true' }}
    needs: package_python
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write   # required for PyPI Trusted Publishing (OIDC)

    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: python-*
          merge-multiple: true
          path: dist/python/

      - name: Publish wheels
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/python/
          skip-existing: true

  deploy_apt_repo:
    name: Deploy APT Repository
    if: ${{ needs.check_secrets.outputs.apt == 'true' }}
    needs: [package_deb, check_secrets]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Download Debian artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          merge-multiple: true
          path: dist/deb/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build signed APT repository
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          chmod +x packaging/build-apt-repo.sh
          packaging/build-apt-repo.sh \
            dist/deb \
            repo-site \
            https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/apt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: repo-site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

  release:
    name: Create GitHub Release
    needs:
      - determine_version
      - build
      - package_python
      - package_deb
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create releases and upload assets

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/          # each artifact lands in dist/<artifact-name>/

      - name: Generate SHA256SUMS
        run: |
          mkdir -p dist/checksums
          # Artifact names are unique across subdirectories, so list them by
          # file name only; users verify with `sha256sum -c --ignore-missing`.
          find dist -type f ! -path 'dist/checksums/*' -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed -E 's#  dist/[^/]+/#  #' > dist/checksums/SHA256SUMS
          cat dist/checksums/SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.determine_version.outputs.version }}
          # Attach every binary found under dist/.
          files: dist/**/*
          # Do not auto-generate notes — release notes are written manually
          # via `gh release edit` after the CI run completes.
          generate_release_notes: false
          # If the release was already created manually (e.g. gh release create),
          # only upload assets without overwriting the body or title.
          fail_on_unmatched_files: true
