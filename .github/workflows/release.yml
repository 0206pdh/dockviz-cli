# release.yml — build cross-platform binaries and publish a GitHub Release
# on every push of a version tag (e.g. v1.2.3).
#
# Artifacts produced:
#   dockviz-linux-amd64
#   dockviz-linux-amd64.deb
#   dockviz-<version>-py3-none-<platform>.whl
#   dockviz-windows-amd64.exe
#   dockviz-darwin-amd64
name: Release

on:
  push:
    tags:
      - "v*"   # trigger on any tag that looks like a version

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: windows
            goarch: arm64
            ext: ".exe"
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod   # reads the 'go' directive from go.mod

      - name: Build binary
        run: |
          GOOS=${{ matrix.goos }} \
          GOARCH=${{ matrix.goarch }} \
          go build \
            -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o dockviz-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dockviz-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dockviz-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          if-no-files-found: error

  package_python:
    name: Package Python Wheel (${{ matrix.artifact }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - artifact: dockviz-linux-amd64
            binary: dockviz-linux-amd64
            plat_name: manylinux_2_17_x86_64
          - artifact: dockviz-linux-arm64
            binary: dockviz-linux-arm64
            plat_name: manylinux_2_17_aarch64
          - artifact: dockviz-windows-amd64
            binary: dockviz-windows-amd64.exe
            plat_name: win_amd64
          - artifact: dockviz-windows-arm64
            binary: dockviz-windows-arm64.exe
            plat_name: win_arm64
          - artifact: dockviz-darwin-amd64
            binary: dockviz-darwin-amd64
            plat_name: macosx_10_13_x86_64
          - artifact: dockviz-darwin-arm64
            binary: dockviz-darwin-arm64
            plat_name: macosx_11_0_arm64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}/

      - name: Install Python build tooling
        run: python -m pip install --upgrade build setuptools wheel

      - name: Build wheel
        env:
          DOCKVIZ_BINARY: dist/${{ matrix.artifact }}/${{ matrix.binary }}
          DOCKVIZ_VERSION: ${{ github.ref_name }}
          DOCKVIZ_WHEEL_PLAT_NAME: ${{ matrix.plat_name }}
        run: python -m build --wheel --outdir dist/python

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.artifact }}
          path: dist/python/*.whl
          if-no-files-found: error

  package_deb:
    name: Package Debian (${{ matrix.arch }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - artifact: dockviz-linux-amd64
            binary: dockviz-linux-amd64
            arch: amd64
          - artifact: dockviz-linux-arm64
            binary: dockviz-linux-arm64
            arch: arm64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}/

      - name: Build Debian package
        run: |
          chmod +x packaging/build-deb.sh
          packaging/build-deb.sh \
            dist/${{ matrix.artifact }}/${{ matrix.binary }} \
            ${{ github.ref_name }} \
            ${{ matrix.arch }} \
            dist/deb/dockviz-linux-${{ matrix.arch }}.deb

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/deb/*.deb
          if-no-files-found: error

  publish_pypi:
    name: Publish To PyPI
    if: ${{ secrets.PYPI_API_TOKEN != '' }}
    needs: package_python
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: python-*
          merge-multiple: true
          path: dist/python/

      - name: Publish wheels
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/python/
          skip-existing: true

  deploy_apt_repo:
    name: Deploy APT Repository
    if: ${{ secrets.APT_GPG_PRIVATE_KEY != '' }}
    needs: package_deb
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download Debian artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          merge-multiple: true
          path: dist/deb/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build signed APT repository
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          chmod +x packaging/build-apt-repo.sh
          packaging/build-apt-repo.sh \
            dist/deb \
            repo-site \
            https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/apt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo-site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  release:
    name: Create GitHub Release
    needs:
      - build
      - package_python
      - package_deb
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create releases and upload assets

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/          # each artifact lands in dist/<artifact-name>/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Attach every binary found under dist/.
          files: dist/**/*
          # Do not auto-generate notes — release notes are written manually
          # via `gh release edit` after the CI run completes.
          generate_release_notes: false
          # If the release was already created manually (e.g. gh release create),
          # only upload assets without overwriting the body or title.
          fail_on_unmatched_files: true
